# Chạy: KAGENT_SECRET_KEY lấy từ file .env cạnh file này (đã gitignore), rồi `docker compose up -d --build`.
services:
  kagent:
    build:
      context: .
      args:
        BASE_IMAGE: ${KAGENT_BASE_IMAGE:-python:3.12-bookworm}
        PIP_INDEX_URL: ${KAGENT_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${KAGENT_PIP_TRUSTED_HOST:-pypi.org}
        KUBECTL_URL: ${KAGENT_KUBECTL_URL:-https://dl.k8s.io/release/v1.29.3/bin/linux/amd64/kubectl}
        HELM_URL: ${KAGENT_HELM_URL-https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz}
        # "-" chứ không phải ":-": đặt rỗng trong .env là bỏ qua khi mirror chưa có.
        HELM_DIFF_URL: ${KAGENT_HELM_DIFF_URL-https://github.com/databus23/helm-diff/releases/download/v3.15.15/helm-diff-linux-amd64.tgz}
        HELM_DRIFT_URL: ${KAGENT_HELM_DRIFT_URL-https://github.com/nikhilsbhat/helm-drift/releases/download/v0.1.2/helm-drift_0.1.2_linux_x86_64.tar.gz}
        HELM2_URL: ${KAGENT_HELM2_URL-https://get.helm.sh/helm-v2.17.0-linux-amd64.tar.gz}
        HELM2_DIFF_URL: ${KAGENT_HELM2_DIFF_URL-https://github.com/databus23/helm-diff/releases/download/v3.7.0/helm-diff-linux-amd64.tgz}
    image: kagent:local
    restart: unless-stopped
    ports:
      - "${KAGENT_BIND:-127.0.0.1}:${KAGENT_PORT:-8000}:8000"  # KAGENT_BIND=0.0.0.0 để máy khác trong LAN truy cập
    environment:
      # Khóa chủ để ngoài volume dữ liệu, để bản sao dữ liệu không kèm khóa giải mã LLM key.
      KAGENT_SECRET_KEY: ${KAGENT_SECRET_KEY:?đặt KAGENT_SECRET_KEY trong .env}
      KAGENT_COOKIE_SECURE: ${KAGENT_COOKIE_SECURE:-0}  # 1 khi đứng sau HTTPS
      KAGENT_ADMIN_PASSWORD: ${KAGENT_ADMIN_PASSWORD:-}
      KAGENT_DEMO_PASSWORD: ${KAGENT_DEMO_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KAGENT_LLM: ${KAGENT_LLM:-auto}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # LLM tự host chạy trên máy host (localhost trong container là chính container)
    volumes:
      - kagent-data:/data

volumes:
  kagent-data:
